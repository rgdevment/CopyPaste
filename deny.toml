[graph]
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range: sin mantenimiento, no vulnerable; llega por urlpattern en tauri-utils y no es nuestro para reemplazar" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common: igual que el anterior, por la misma cadena de Tauri" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property: igual que el anterior, por la misma cadena de Tauri" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version: igual que el anterior, por la misma cadena de Tauri" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident: igual que el anterior, por la misma cadena de Tauri" },
]

[licenses]
allow = [
  "GPL-3.0-only",
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "BSL-1.0",
  "Zlib",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-registry = "deny"
unknown-git = "deny"
