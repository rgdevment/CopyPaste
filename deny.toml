[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste está terminado, no roto: llega por skia-bindings y wgpu, sin alternativa aguas arriba" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser llega por winit (sctk-adwaita, solo Wayland) y por Slint; sin vulnerabilidad, a la espera de que aguas arriba migre a skrifa" },
]

[licenses]
allow = [
  "GPL-3.0-only",
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "BSL-1.0",
  "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
