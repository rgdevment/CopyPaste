[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
repository = "https://github.com/rgdevment/CopyPaste"
publish = false

[workspace.dependencies]
cp-core = { path = "crates/cp-core" }
cp-store = { path = "crates/cp-store" }
cp-mac-sys = { path = "crates/cp-mac-sys" }
cp-mac = { path = "crates/cp-mac" }
cp-win = { path = "crates/cp-win" }
cp-win-sys = { path = "crates/cp-win-sys" }

thiserror = "2"
tracing = "0.1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
blake3 = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
unicode-normalization = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "gif", "bmp", "webp"] }
proptest = "1"
tempfile = "3"

windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation_Collections",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

windows-future = "0.3"

slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia", "renderer-skia-opengl", "raw-window-handle-06"] }
slint-build = "1.18"
raw-window-handle = "0.6"

objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
objc2-application-services = "0.3"
objc2-vision = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "AVAssetTrack"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
