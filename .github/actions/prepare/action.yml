name: Prepare the build
description: >-
  Rust toolchain and the release version stamped into the manifest. Nothing is restored from a
  cache here, so what a tag publishes is built from the tree and from nothing else.

inputs:
  version:
    description: Version to stamp into Cargo.toml.
    required: true
  targets:
    description: Rust targets to install, comma separated.
    required: true

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        targets: ${{ inputs.targets }}

    - name: Stamp the version
      shell: bash
      env:
        ASKED_FOR: ${{ inputs.version }}
      run: |
        version="$ASKED_FOR"

        cargo fetch --locked --offline 2>/dev/null || cargo fetch --locked

        sed -i.bak -e "s/^version = .*/version = \"$version\"/" Cargo.toml
        rm -f Cargo.toml.bak

        if ! grep -q "^version = \"$version\"\$" Cargo.toml; then
          echo "::error::could not stamp $version into Cargo.toml"
          exit 1
        fi

        cargo update --workspace --offline
