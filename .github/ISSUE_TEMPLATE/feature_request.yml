name: "💡 Feature request"
description: "Something CopyPaste could do, or do better"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. CopyPaste tries to stay small, fast and private: everything stays on
        your machine, nothing needs an account, and the panel should feel native on Windows and
        on a Mac. A request that keeps to that has the best chance.

        Not sure it is a feature yet? [Discussions](https://github.com/rgdevment/CopyPaste/discussions)
        is the place to think it through first.
  - type: textarea
    id: problem
    attributes:
      label: "What are you trying to do?"
      description: "The situation, not the solution: what you were doing when CopyPaste fell short."
      placeholder: "I copy the same three addresses every day and have to search for them each time."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: "What would help"
      description: "How you picture it working. A sketch or a screenshot of another app is welcome."
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: "Which systems"
      options:
        - "Windows and macOS"
        - "Windows only"
        - "macOS only"
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: "How you get by today (optional)"
      description: "A workaround, or another app that does it well."
