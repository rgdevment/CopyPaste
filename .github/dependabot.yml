version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-majors:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    groups:
      # windows-rs crates share a windows-core: one moving alone breaks the OCR.
      windows-rs:
        patterns:
          - "windows"
          - "windows-*"
      rust:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      rust-majors:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    groups:
      window:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      window-majors:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore"
