name: Mutants

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: the crates this branch touched
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mutable: ${{ steps.look.outputs.mutable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: look
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "mutable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          watched='^(crates/|\.cargo/mutants\.toml$|\.github/workflows/mutants\.yml$)'
          from=$(git merge-base "$BASE" HEAD)
          if git diff --name-only --diff-filter=d "$from" HEAD | grep -qE "$watched"; then
            echo "mutable=true" >> "$GITHUB_OUTPUT"
          else
            echo "mutable=false" >> "$GITHUB_OUTPUT"
          fi

  on-the-branch:
    name: ${{ matrix.name }} / the lines this branch changed
    needs: changes
    if: needs.changes.outputs.mutable == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: windows 1 of 2
            crates: -p cp-core -p cp-store -p cp-win -p cp-panel
            shard: --shard 0/2
          - os: windows-2025
            name: windows 2 of 2
            crates: -p cp-core -p cp-store -p cp-win -p cp-panel
            shard: --shard 1/2
          - os: macos-15
            name: macos
            crates: -p cp-core -p cp-store -p cp-config -p cp-mac
            shard: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: What the branch changed in the crates
        id: touched
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          from=$(git merge-base "$BASE" HEAD)
          git diff "$from" -- crates > branch.diff
          if [ -s branch.diff ]; then echo "any=yes" >> "$GITHUB_OUTPUT"; fi

      - name: Rust, from rust-toolchain.toml
        if: steps.touched.outputs.any == 'yes'
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: mutants
          save-if: false
        if: steps.touched.outputs.any == 'yes'
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        if: steps.touched.outputs.any == 'yes'
        with:
          tool: cargo-mutants
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        if: steps.touched.outputs.any == 'yes'
        with:
          tool: nextest

      - name: A mutant that lives on a line this branch wrote
        id: run
        if: steps.touched.outputs.any == 'yes'
        shell: bash
        run: |
          set +e
          cargo mutants ${{ matrix.crates }} ${{ matrix.shard }} --in-diff branch.diff --no-times -j 2
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: What survived
        if: always() && steps.touched.outputs.any == 'yes'
        shell: bash
        env:
          CODE: ${{ steps.run.outputs.code }}
          TITLE: ${{ matrix.name }}, the lines this branch changed
        run: bash scripts/mutants-report.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.touched.outputs.any == 'yes'
        with:
          name: mutants-branch-${{ matrix.os }}-${{ strategy.job-index }}
          path: mutants.out/
          retention-days: 7
