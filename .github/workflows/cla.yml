name: CLA

on: # zizmor: ignore[dangerous-triggers] the called workflow reads the pull request through the API and never checks it out
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  # The ruleset requires this as «Check CLA signature / signature»: a called job is named after both.
  cla:
    name: Check CLA signature
    permissions:
      actions: write
      pull-requests: write
    uses: rgdevment/cla-signatures/.github/workflows/cla.yml@0b313d465bc0edf42dc592d5f782434e108564f3 # v1.0.0
    with:
      project: copypaste
      document-url: https://github.com/rgdevment/CopyPaste/blob/main/CLA.md
      not-signed-message: >-
        Thanks for the pull request. CopyPaste is released under the GPL-3.0 and offered under
        separate commercial terms, which requires a signature from whoever opened it and every
        author and co-author of its commits before it can be merged. You keep the copyright on
        your work. To sign, post a comment on this pull request with:
    secrets:
      signatures-token: ${{ secrets.CLA_SIGNATURES_TOKEN }}
