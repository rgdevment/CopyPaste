name: Commits

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventional:
    name: Conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every commit follows the convention
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+'
          failed=0

          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::${sha:0:8} no sigue la convención"
              printf '  %s\n' "$subject"
              failed=1
              continue
            fi

            if [ "${#subject}" -gt 90 ]; then
              echo "::error::${sha:0:8} tiene ${#subject} caracteres; el asunto va bajo 90"
              printf '  %s\n' "$subject"
              failed=1
            fi
          done < <(git rev-list --no-merges "$BASE".."$HEAD")

          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "Se espera: tipo(ámbito opcional): descripción"
            echo "Tipos:     feat fix docs style refactor perf test build ci chore revert"
            echo "Ejemplo:   fix(panel): the menu yields to the wheel"
            exit 1
          fi

          echo "todos los asuntos están bien formados"
