name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # anything not known to stay out of Rust's way counts as Rust, so a new path runs the whole suite
  changes:
    name: what the branch touched in Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.look.outputs.rust }}
      window: ${{ steps.look.outputs.window }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: look
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "window=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          aside='^(app/src/|app/(biome\.json|index\.html|package(-lock)?\.json|stryker\.config\.json'
          aside+='|tsconfig(\.node)?\.json|vite\.config\.ts)$|hooks/|packaging/|resources/|[^/]+\.md$'
          aside+='|package(-lock)?\.json$|\.markdownlint(-cli2\.jsonc|\.yaml)$|\.editorconfig$|\.github/ISSUE_TEMPLATE/'
          aside+='|\.github/(FUNDING|dependabot)\.yml$|\.github/(oversized\.txt|bridge-manifest\.json|v2-release-pubkey\.txt)$'
          aside+='|\.github/workflows/(advisories|bundle|caches|cla|commits|feed|mutants|mutants-sweep|release|rules)\.yml$'
          aside+='|scripts/(branches|commits|mutants-report|news|rules|sign_manifest|signed_for|verify_manifest)\.sh$'
          aside+='|scripts/(fill_manifest|generations|mutants_cover|mutants_score|oversized|workflows_parse)\.py$'
          aside+='|scripts/third-party\.mjs$|scripts/licences/)'
          # the Rust reads these with include_str!, so they are Rust wherever they live
          included='^(app/src/(news\.json|locales\.ts)|THIRD-PARTY-(BUNDLED|LICENSES)\.md)$'
          from=$(git merge-base "$BASE" HEAD)
          changed=$(git diff --name-only "$from" HEAD)
          first=$( { echo "$changed" | grep -E "$included"; echo "$changed" | grep -vE "$aside"; } \
            | grep -v '^$' | head -1 || true)
          [ -n "$first" ] && rust=true || rust=false
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          window=$rust
          echo "$changed" | grep -qE '^app/' && window=true
          echo "window=$window" >> "$GITHUB_OUTPUT"
          echo "the first path Rust has to answer for: ${first:-none}"

  check:
    name: test / ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust, from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest

      - uses: ./.github/actions/sidecar

      - run: cargo clippy --workspace --all-targets
      - run: cargo nextest run --workspace --no-tests=pass
      - if: runner.os == 'Windows'
        run: cargo test --doc --workspace

      - if: runner.os == 'macOS'
        run: cargo run -p cp-mac --example mac_probe
      - name: The probe reads a real clipboard, so leave something on it
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-Clipboard -Value "cp-probe"
      - if: runner.os == 'Windows'
        run: cargo run -p cp-win --example win_probe

  # a matrix job skipped by its if reports under its unexpanded name, so the ruleset asks this one instead
  tests:
    name: tests
    if: always()
    needs: [changes, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every system passed, or the branch never touched what they test
        env:
          LOOKED: ${{ needs.changes.result }}
          RUST: ${{ needs.changes.outputs.rust }}
          RESULT: ${{ needs.check.result }}
        run: |
          [ "$LOOKED" = "success" ] || { echo "::error::what the branch touched could not be read ($LOOKED)"; exit 1; }
          [ "$RESULT" = "success" ] || { [ "$RUST" = "false" ] && [ "$RESULT" = "skipped" ]; } \
            || { echo "::error::the tests ended as $RESULT"; exit 1; }

  lint:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust, from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - run: cargo fmt --all --check
      - name: The probe bodies are formatted too
        run: rustfmt --check --edition 2024 crates/cp-mac/examples/probe/battery.rs crates/cp-win/examples/probe/battery.rs crates/cp-win/examples/probe/restoring.rs

  window:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # the other run of the suite sits behind a coverage gate, and an assertion broken here must still be told
      - run: npm test

  prose:
    name: markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint:md

  cross:
    name: the macOS crates still build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust, from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup target add aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: cross
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --target aarch64-apple-darwin -p cp-mac -p cp-mac-sys
      - run: cargo check --target aarch64-apple-darwin -p cp-mac-sys --all-targets

  deny:
    name: advisories + licences
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check bans licenses sources
      # an advisory published today is no fault of the branch: the daily Advisories run moves the lock past it
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          command: check advisories

  coverage:
    name: coverage
    needs: changes
    # a dependency bump changes no line of ours, so it pays for neither coverage nor Sonar
    if: github.actor != 'dependabot[bot]' && needs.changes.outputs.window == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust, from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      - name: The app only needs the sidecar to exist here, nobody runs it
        shell: bash
        run: |
          mkdir -p app/src-tauri/binaries
          triple=$(rustc -vV | sed -n 's/^host: //p')
          : > "app/src-tauri/binaries/cp-panel-$triple"

      - run: cargo llvm-cov --no-report --workspace
      - run: cargo llvm-cov --no-report run -p cp-mac --example mac_probe
      - run: cargo llvm-cov report --lcov --output-path lcov-rust.info --ignore-filename-regex 'cp-panel[/\]src[/\](app|handing|here|main|measure|orders|reaching|showing)\.rs|_test\.rs$|src-tauri[/\]src[/\]'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: The window, measured too
        working-directory: app
        run: |
          npm ci
          npm run test:coverage

      - name: Every path is relative to the repository, which is what Sonar reads
        if: always()
        shell: bash
        run: python3 scripts/lcov_paths.py lcov-rust.info app/coverage/lcov.info=app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: |
            lcov-rust.info
            app/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1
      - name: The threshold is asked after the measuring, so a dip still ships the report
        if: always()
        run: cargo llvm-cov report --fail-under-lines 85 --summary-only --ignore-filename-regex 'cp-panel[/\]src[/\](app|handing|here|main|measure|orders|reaching|showing)\.rs|_test\.rs$|src-tauri[/\]src[/\]'

  coverage-windows:
    name: coverage / the Windows crates
    needs: changes
    if: github.actor != 'dependabot[bot]' && needs.changes.outputs.rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust, from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --no-report -p cp-core -p cp-store -p cp-win -p cp-win-sys -p cp-panel -p cp-config
      - name: The probe reads a real clipboard, so leave something on it
        shell: pwsh
        run: Set-Clipboard -Value "cp-probe"
      - run: cargo llvm-cov --no-report run -p cp-win --example win_probe
      - run: cargo llvm-cov report --lcov --output-path lcov-win.info --ignore-filename-regex 'cp-panel[/\]src[/\](app|handing|here|main|measure|orders|reaching|showing)\.rs|_test\.rs$|src-tauri[/\]src[/\]'
      - name: Every path is relative to the repository, which is what Sonar reads
        if: always()
        shell: bash
        run: python scripts/lcov_paths.py lcov-win.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-windows
          path: lcov-win.info
          if-no-files-found: error
          retention-days: 1
      - name: The threshold is asked after the measuring, so a dip still ships the report
        if: always()
        run: cargo llvm-cov report --fail-under-lines 85 --summary-only --ignore-filename-regex 'cp-panel[/\]src[/\](app|handing|here|main|measure|orders|reaching|showing)\.rs|_test\.rs$|src-tauri[/\]src[/\]'

  sonar:
    name: sonarcloud
    needs: [coverage, coverage-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # a branch that only touched the window measured no Windows crate, and Sonar reads what there is
    if: >-
      always()
      && needs.coverage.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.coverage-windows.result)
      && github.actor != 'dependabot[bot]'
      && (github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: .

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.coverage-windows.result == 'success'
        with:
          name: coverage-windows
          path: .

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: The types Sonar needs to read the window
        working-directory: app
        run: npm ci

      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=crates,app/src,app/src-tauri/src
            -Dsonar.tests=crates,app/src,app/src-tauri/src
            -Dsonar.test.inclusions=app/src/**/*.test.ts,app/src/**/*.test.tsx,app/src/tests/**,crates/**/*_test.rs,app/src-tauri/src/**/*_test.rs
            -Dsonar.exclusions=crates/*/examples/**,crates/*/build.rs,crates/**/*_test.rs,app/src-tauri/src/**/*_test.rs
            -Dsonar.rust.lcov.reportPaths=lcov-rust.info,lcov-win.info
            -Dsonar.javascript.lcov.reportPaths=app/coverage/lcov.info
            -Dsonar.rust.clippy.enabled=false
            -Dsonar.cpd.exclusions=app/src/locales.ts
            -Dsonar.coverage.exclusions=app/src/main.tsx,app/src-tauri/src/**,crates/cp-panel/src/main.rs,crates/cp-panel/src/app.rs,crates/cp-panel/src/handing.rs,crates/cp-panel/src/orders.rs,crates/cp-panel/src/here.rs,crates/cp-panel/src/showing.rs,crates/cp-panel/src/measure.rs,crates/cp-panel/src/reaching.rs
            -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}
            -Dsonar.qualitygate.timeout=300
