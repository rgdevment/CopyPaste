name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lints and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # El ciclo real contra el portapapeles del sistema. No cabe en cargo
      # test porque NSPasteboard exige el hilo principal y el runner no lo
      # garantiza.
      - run: cargo run -p cp-mac --example probe
        if: runner.os == 'macOS'

  cross:
    name: The macOS crates still build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Da la señal de que un cambio en el núcleo rompió macOS sin esperar al
      # runner de macOS, que es el más lento y el más escaso.
      - run: cargo check --target aarch64-apple-darwin -p cp-mac -p cp-mac-sys

  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
