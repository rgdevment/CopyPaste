name: Rules

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  conventions:
    name: Project conventions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # rules.sh does the parsing now, so the hook catches it before a push does. What it needs
      # is only the library.
      - name: The library that rule needs
        run: |
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages pyyaml

      # Parsing says nothing of a needs that names a job that is gone, or of input expanded
      # into a shell.
      - name: The workflows mean what they say
        env:
          SHELLCHECK_OPTS: --severity=warning
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      - name: Project conventions
        run: bash scripts/rules.sh

  deterministic:
    name: Tests are deterministic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace
          save-if: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest
      - name: The core, over and over
        run: |
          turns=4
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            turns=20
          fi
          for _ in $(seq 1 "$turns"); do
            cargo nextest run -p cp-core --no-tests=pass || exit 1
          done

  budget:
    name: Latency stays within budget
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CP_BUDGET_SLACK: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: budget
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo run -p cp-store --release --example budget
      - run: cargo run -p cp-config --release --example weigh
