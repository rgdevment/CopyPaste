name: Rules

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  conventions:
    name: Project conventions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # El que importa es el de publicación: solo corre cuando la etiqueta ya está empujada.
      - name: The workflows parse
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages pyyaml
          python3 - <<'PY'
          import pathlib
          import sys

          import yaml

          bad = 0
          for one in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(one.read_text(encoding="utf-8"))
              except yaml.YAMLError as why:
                  print(f"::error::{one} no es YAML válido, así que lo que lanza no se lanzará")
                  print(why)
                  bad = 1
          sys.exit(bad)
          PY

      - name: Unsafe lives only in the -sys crates
        run: |
          expected="crates/cp-mac-sys crates/cp-win-sys"
          found=$(grep -rl 'unsafe_code = "allow"' crates/*/Cargo.toml | xargs -n1 dirname | sort | tr '\n' ' ')
          for dir in $found; do
            case " $expected " in
              *" $dir "*) ;;
              *) echo "::error::unsafe declarado fuera de los crates -sys: $dir"; exit 1 ;;
            esac
          done

      - name: The core produces no terminal output
        run: |
          if grep -rnE '^[^"]*(^|[ \t{;(=>|&])(e?print(ln)?!)' crates/cp-core/src --include='*.rs'; then
            echo "::error::cp-core no imprime: usa tracing"; exit 1
          fi

      - name: The core touches neither platform nor interface
        run: |
          if grep -rn 'use tauri\|use windows\|use objc2' crates/cp-core/src --include='*.rs'; then
            echo "::error::cp-core no depende de plataforma ni de interfaz"; exit 1
          fi

      - name: No Spanish identifiers
        run: |
          if grep -rnE '\b(fecha|limite|prioridad|filtro|tarea|titulo|etiqueta|imagen|archivo) *:' \
               crates/*/src --include='*.rs' | grep -v '"' | grep -vE ':[0-9]+: *///?!?'; then
            echo "::error::los identificadores van en inglés"; exit 1
          fi

      - name: No voseo in the Spanish anywhere
        run: |
          if grep -rniE '\b(v[o]s|ten[é]s|quer[é]s|pod[é]s|and[á]|mir[á]|hac[é]|ch[e])\b' \
               crates docs README.md --include='*.rs' --include='*.md' 2>/dev/null | grep -q .; then
            echo "::error::español neutro, sin voseo"; exit 1
          fi

      - name: No peninsular Spanish in what a person reads
        run: |
          if grep -rniE '\b(fichero|ficheros|ordenador|pulsa|pulsar|pulsando)\b' \
               crates docs README.md --include='*.rs' --include='*.md' 2>/dev/null | grep -q .; then
            echo "::error::español neutro: archivo, computador, presiona"; exit 1
          fi

      - name: The code carries no comments
        run: |
          if grep -rnE '[/]{2}' crates --include='*.rs' | grep -vE '[a-z]+:[/][/]' | grep -q .; then
            echo "::error::el código va sin comentarios; lo que haya que explicar va al expediente"; exit 1
          fi
          if grep -rnE '[/][*]' crates --include='*.rs' | grep -q .; then
            echo "::error::tampoco comentarios de bloque"; exit 1
          fi

  deterministic:
    name: Tests are deterministic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace
          save-if: false
      - uses: taiki-e/install-action@nextest
      - name: The core, over and over
        run: |
          turns=4
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            turns=20
          fi
          for i in $(seq 1 "$turns"); do
            cargo nextest run -p cp-core --no-tests=pass || exit 1
          done

  coverage:
    name: Coverage does not slip
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --no-report --workspace
      - run: cargo llvm-cov --no-report run -p cp-mac --example probe
      - run: cargo llvm-cov report --fail-under-lines 90 --summary-only --ignore-filename-regex 'cp-panel[/\]src[/\](app|main|measure)\.rs'

  coverage-windows:
    name: Coverage does not slip on Windows
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --no-report -p cp-core -p cp-store -p cp-win -p cp-win-sys -p cp-panel -p cp-config
      - name: The probe reads a real clipboard, so leave something on it
        shell: pwsh
        run: Set-Clipboard -Value "cp-probe"
      - run: cargo llvm-cov --no-report run -p cp-win --example probe
      - run: cargo llvm-cov report --fail-under-lines 95 --summary-only --ignore-filename-regex 'cp-panel[/\]src[/\](app|main|measure)\.rs'

  budget:
    name: Latency stays within budget
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CP_BUDGET_SLACK: "4"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: budget
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo run -p cp-store --release --example budget
