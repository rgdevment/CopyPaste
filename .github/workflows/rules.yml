name: Rules

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  conventions:
    name: Project conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: The library that rule needs
        run: |
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages pyyaml

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: zizmor@1.30.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false
      # offline, so a pull request is judged on its own lines and never on whether GitHub's API answered
      - name: The workflows mean what they say
        env:
          SHELLCHECK_OPTS: --severity=warning
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
          zizmor --offline --min-severity medium .github

      - name: No action pinned here is an impostor or has a known vulnerability
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # zizmor exits 1 only when it could not finish; findings exit 10 or more and are not retried
          for try in 1 2 3; do
            code=0
            zizmor --min-severity medium .github || code=$?
            [ "$code" -ne 1 ] && exit "$code"
            echo "::warning::try $try did not finish; asking GitHub again in a minute"
            sleep 60
          done
          exit 1

      - name: Project conventions
        run: bash scripts/rules.sh

      # nothing else looks at a subject that reached main without a pull request
      - name: The subject that landed
        if: github.event_name == 'push'
        run: bash scripts/commits.sh --title "$(git log -1 --format=%s)"

  notices:
    name: The notices match the lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust, from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: The window the notices read
        working-directory: app
        run: npm ci

      - name: Written again, and unchanged
        run: |
          npm run notices
          moved=$(git status --porcelain -- THIRD-PARTY-BUNDLED.md THIRD-PARTY-LICENSES.md)
          if [ -n "$moved" ]; then
            echo "$moved"
            git diff -- THIRD-PARTY-BUNDLED.md THIRD-PARTY-LICENSES.md | head -200
            echo "::error::THIRD-PARTY-BUNDLED.md or THIRD-PARTY-LICENSES.md is behind the lockfiles. Run «npm run notices» \
          and commit what it writes."
            exit 1
          fi

  # one turn of the suite is what CI already runs on every pull request, so this job only earns its
  # runners when it runs the twenty that say whether a test is deterministic
  deterministic:
    name: Tests are deterministic (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust, from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: workspace
          save-if: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest
      - name: The core, over and over
        run: |
          for _ in $(seq 1 20); do
            cargo nextest run -p cp-core --no-tests=pass || exit 1
          done

  budget:
    name: Latency stays within budget
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CP_BUDGET_SLACK: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust, from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: budget
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo run -p cp-store --release --example budget
      - run: cargo run -p cp-config --release --example weigh
