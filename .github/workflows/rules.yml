name: Rules

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  conventions:
    name: Project conventions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: The workflows parse
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages pyyaml
          python3 - <<'PY'
          import pathlib
          import sys

          import yaml


          class Strict(yaml.SafeLoader):
              pass


          def no_twice(loader, node, deep=False):
              seen = set()
              for key, _ in node.value:
                  name = loader.construct_object(key, deep=deep)
                  if name in seen:
                      raise yaml.YAMLError(f"the «{name}» key is repeated")
                  seen.add(name)
              return yaml.SafeLoader.construct_mapping(loader, node, deep)


          Strict.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, no_twice)

          bad = 0
          for one in sorted(pathlib.Path(".github").rglob("*.yml")):
              try:
                  yaml.load(one.read_text(encoding="utf-8"), Strict)
              except yaml.YAMLError as why:
                  print(f"::error::{one} is not valid YAML, so what it launches will not launch")
                  print(why)
                  bad = 1
          sys.exit(bad)
          PY

      - name: Project conventions
        run: bash scripts/rules.sh

  deterministic:
    name: Tests are deterministic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace
          save-if: false
      - uses: taiki-e/install-action@nextest
      - name: The core, over and over
        run: |
          turns=4
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            turns=20
          fi
          for i in $(seq 1 "$turns"); do
            cargo nextest run -p cp-core --no-tests=pass || exit 1
          done

  budget:
    name: Latency stays within budget
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CP_BUDGET_SLACK: "4"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: budget
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo run -p cp-store --release --example budget
      - run: cargo run -p cp-config --release --example weigh
