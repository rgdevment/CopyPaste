name: Caches

on: # zizmor: ignore[dangerous-triggers] neither job checks out the pull request; they only delete caches through the API
  pull_request_target:
    types: [closed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Lists what would go, deleting nothing."
        type: boolean
        default: true

permissions: {}

jobs:
  # main runs CI again on the merge, and Mutants only ever measures a pull request, so nothing left running here is owed
  stop:
    name: a closed pull request stops what still runs for it
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Every run still going for its last commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh run list --commit "$HEAD_SHA" --event pull_request --limit 100             --json databaseId,status             --jq '.[] | select(.status != "completed") | .databaseId' |
            while read -r run; do
              gh run cancel "$run" || echo "::notice::run $run had already ended"
            done

  sweep:
    name: a closed pull request takes its caches with it
    permissions:
      actions: write
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Everything written under this pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: gh cache delete --all --ref "$REF" --succeed-on-no-caches

  generations:
    name: one generation of each cache, and nothing a tag left behind
    # the branch filter on workflow_run reads the branch of the run that triggered it, and a
    # fork's pull request can name its branch main: only a push to this repository counts
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
      || (github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    concurrency:
      group: cache-generations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: What no build will ask for again
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python3 scripts/generations.py
