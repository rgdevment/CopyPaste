name: Release (Windows)

on:
    workflow_call:
        inputs:
            version:
                required: true
                type: string
    workflow_dispatch:
        inputs:
            version:
                description: "Version to use (e.g. 2.1.0). Defaults to 2.0.0-dev"
                required: false
                default: "2.0.0-dev"

permissions:
    contents: read

jobs:
    release-windows:
        runs-on: windows-latest
        timeout-minutes: 30
        name: Build Windows

        env:
            PFX_BASE64: ${{ secrets.PFX_BASE64 }}
            PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.ref_name }}

            - name: Resolve version
              id: get_version
              shell: bash
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  IS_PRERELEASE="false"
                  if [[ "$VERSION" == *-* ]]; then
                    IS_PRERELEASE="true"
                  fi
                  echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
                  echo "Version: $VERSION  PreRelease: $IS_PRERELEASE"

            - uses: ./.github/actions/setup-flutter-workspace
              with:
                  version: ${{ steps.get_version.outputs.VERSION }}

            - name: Install Fastforge
              run: dart pub global activate fastforge

            - name: Install Inno Setup
              run: choco install innosetup --no-progress

            - name: Build standalone (exe installer)
              shell: pwsh
              run: |
                  Push-Location app
                  fastforge package `
                    --platform windows `
                    --targets exe `
                    --build-dart-define "STORE_BUILD=false" `
                    --build-dart-define "APP_VERSION=${{ steps.get_version.outputs.VERSION }}"
                  Pop-Location

            - name: Decode signing certificate
              if: env.PFX_BASE64 != ''
              shell: pwsh
              run: |
                  $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
                  Set-Content -Path signingCert.pfx -Value $bytes -AsByteStream

            - name: Sign standalone installer
              if: env.PFX_BASE64 != ''
              shell: pwsh
              run: |
                  $pfxPath = Join-Path $PWD 'signingCert.pfx'
                  $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
                    -Recurse -Filter "signtool.exe" |
                    Where-Object { $_.FullName -like "*x64*" } |
                    Sort-Object FullName -Descending |
                    Select-Object -First 1
                  if (-not $signtool) { Write-Error "Signtool not found"; exit 1 }

                  $distDir = "app/dist"
                  Get-ChildItem -Path $distDir -Include *.exe -Recurse | ForEach-Object {
                    & $signtool.FullName sign /f $pfxPath /p $env:PFX_PASSWORD `
                      /tr http://timestamp.digicert.com /td sha256 /fd sha256 $_.FullName
                  }

            - name: Rename standalone installer
              shell: pwsh
              run: |
                  $version = "${{ steps.get_version.outputs.VERSION }}"
                  $distDir = "app/dist"
                  $setup = Get-ChildItem -Path $distDir -Recurse -Filter "*-setup.exe" | Select-Object -First 1
                  if (-not $setup) {
                    Write-Host "::error::No installer matching *-setup.exe under $distDir"
                    Get-ChildItem -Path $distDir -Recurse -File | ForEach-Object { Write-Host $_.FullName }
                    exit 1
                  }
                  $newName = "CopyPaste_${version}_x64_Setup.exe"
                  Move-Item -Path $setup.FullName -Destination (Join-Path $setup.DirectoryName $newName)
                  Write-Host "Renamed to: $newName"

            - name: Build store MSIX
              if: steps.get_version.outputs.IS_PRERELEASE != 'true'
              shell: pwsh
              run: |
                  Push-Location app
                  fastforge package `
                    --platform windows `
                    --targets msix `
                    --build-dart-define "STORE_BUILD=true" `
                    --build-dart-define "APP_VERSION=${{ steps.get_version.outputs.VERSION }}"
                  Pop-Location

            - name: Move and rename store MSIX
              if: steps.get_version.outputs.IS_PRERELEASE != 'true'
              shell: pwsh
              run: |
                  $version = "${{ steps.get_version.outputs.VERSION }}"
                  $distDir = "app/dist"

                  # store: true generates .msixupload, not .msix
                  $extensions = @("*.msixupload", "*.msixbundle", "*.msix")
                  $searchDirs = @("app/dist", "app/build")
                  $found = $null
                  foreach ($ext in $extensions) {
                    $found = $searchDirs | ForEach-Object {
                      if (Test-Path $_) { Get-ChildItem -Path $_ -Recurse -Filter $ext }
                    } | Select-Object -First 1
                    if ($found) { break }
                  }

                  if (-not $found) {
                    Write-Host "::error::No MSIX package found under app/dist or app/build"
                    @("app/dist", "app/build") | ForEach-Object {
                      if (Test-Path $_) { Get-ChildItem -Path $_ -Recurse -File | ForEach-Object { Write-Host $_.FullName } }
                    }
                    exit 1
                  }

                  $newName = "CopyPaste_${version}_x64_store$($found.Extension)"
                  New-Item -ItemType Directory -Path $distDir -Force | Out-Null
                  Move-Item -Path $found.FullName -Destination (Join-Path $distDir $newName)
                  Write-Host "Moved $($found.Name) to: $newName"

            - name: Upload artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: release-windows
                  path: app/dist/
                  retention-days: 5
