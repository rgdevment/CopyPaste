name: Bundle

on:
  push:
    branches: [main]
    paths:
      - "app/src-tauri/installer.nsi"
      - "app/src-tauri/tauri.conf.json"
      - "app/src-tauri/Cargo.toml"
      - "app/src-tauri/build.rs"
      - "app/package.json"
      - "scripts/sidecar.py"
      - "Cargo.toml"
      - ".github/actions/sidecar/action.yml"
      - ".github/workflows/bundle.yml"
      - ".github/workflows/release.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # `paths` on the trigger leaves a required check unreported for good; a skipped job counts as met.
  changes:
    name: what the branch touched
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      packaging: ${{ steps.look.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: look
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          watched='^(app/src-tauri/(installer\.nsi|tauri\.conf\.json|Cargo\.toml|build\.rs)'
          watched+='|app/package\.json|scripts/sidecar\.py|Cargo\.toml$'
          watched+='|\.github/actions/sidecar/action\.yml$'
          watched+='|\.github/workflows/(bundle|release)\.yml$)'
          from=$(git merge-base "$BASE" HEAD)
          if git diff --name-only --diff-filter=d "$from" HEAD | grep -qE "$watched"; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "packaging=false" >> "$GITHUB_OUTPUT"
          fi

  nsis:
    name: the installer builds
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust, from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: bundle
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend
        working-directory: app
        run: npm ci

      - uses: ./.github/actions/sidecar
        with:
          profile: release

      - name: Bundle
        working-directory: app
        shell: bash
        run: npm run tauri build -- --bundles nsis --no-sign

      - name: What the installer was told to do
        shell: bash
        run: |
          setup=$(ls target/release/bundle/nsis/*-setup.exe 2>/dev/null | head -1) || true
          if [ -z "$setup" ]; then
            echo "::error::the bundler produced no installer"
            exit 1
          fi

          script=$(ls target/release/nsis/*/installer.nsi 2>/dev/null | head -1) || true
          if [ -z "$script" ]; then
            echo "::error::makensis ran but left no script behind to read"
            exit 1
          fi

          status=0
          flat=$(mktemp)
          tr -s '[:space:]' ' ' < "$script" > "$flat"
          want() {
            if ! grep -qiF "$1" "$flat"; then
              echo "::error::the generated installer does not $2"
              status=1
            fi
          }
          want 'oname=cp-panel.exe' \
            "lay down the panel; the sidecar was not bundled"
          want 'StrCpy $INSTDIR "$LOCALAPPDATA\Programs' \
            "keep the binaries out of the data folder"
          want '_is1" "UninstallString"' \
            "look for CopyPaste 2 before copying anything"
          for one in history.db history.db-wal history.db-shm config.toml update.json; do
            want "Delete \"\$LOCALAPPDATA\\\${PRODUCTNAME}\\$one\"" \
              "take the $one it owns when asked to delete its data"
          done
          for one in cp-gui.log cp-panel.log; do
            want "Delete \"\$LOCALAPPDATA\\\${PRODUCTNAME}\\logs\\$one\"" \
              "take its own $one"
          done
          for one in blobs thumbs; do
            want "RmDir /r \"\$LOCALAPPDATA\\\${PRODUCTNAME}\\$one\"" \
              "take the $one it owns"
          done
          want 'RmDir "$LOCALAPPDATA\${PRODUCTNAME}\logs"' \
            "leave the log folder only once its own logs are gone"
          want 'RmDir "$LOCALAPPDATA\${PRODUCTNAME}"' \
            "leave the shared folder standing unless it is already empty"
          stray=$(grep -oiE 'RmDir( /[A-Za-z]+)* /r "[^"]*"' "$flat" \
            | grep -viE '(\\blobs|\\thumbs|\$\{BUNDLEID\}|\$INSTDIR)"$' || true)
          if [ -n "$stray" ]; then
            echo "::error::the generated installer takes a whole folder that is not its own, and the one it shares with CopyPaste 2 holds that history: $stray"
            status=1
          fi
          exit $status

      - name: How big it came out
        shell: bash
        run: ls -lh target/release/bundle/nsis/*-setup.exe
