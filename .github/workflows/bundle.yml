name: Bundle

on:
  push:
    branches: [main]
    paths:
      - "app/src-tauri/installer.nsi"
      - "app/src-tauri/tauri.conf.json"
      - "app/src-tauri/Cargo.toml"
      - "app/src-tauri/build.rs"
      - "app/package.json"
      - "scripts/sidecar.py"
      - "Cargo.toml"
      - ".github/actions/sidecar/action.yml"
      - ".github/workflows/bundle.yml"
      - ".github/workflows/release.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # `paths` on the trigger leaves a required check unreported for good; a skipped job counts as met.
  changes:
    name: what the branch touched
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packaging: ${{ steps.look.outputs.packaging }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: look
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          watched='^(app/src-tauri/(installer\.nsi|tauri\.conf\.json|Cargo\.toml|build\.rs)'
          watched+='|app/package\.json|scripts/sidecar\.py|Cargo\.toml$'
          watched+='|\.github/actions/sidecar/action\.yml$'
          watched+='|\.github/workflows/(bundle|release)\.yml$)'
          from=$(git merge-base "$BASE" HEAD)
          if git diff --name-only --diff-filter=d "$from" HEAD | grep -qE "$watched"; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "packaging=false" >> "$GITHUB_OUTPUT"
          fi

  nsis:
    name: the installer builds
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: bundle
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend
        working-directory: app
        run: npm ci

      - uses: ./.github/actions/sidecar
        with:
          profile: release

      - name: Bundle
        working-directory: app
        shell: bash
        run: npm run tauri build -- --bundles nsis --no-sign

      - name: What the installer was told to do
        shell: bash
        run: |
          setup=$(ls target/release/bundle/nsis/*-setup.exe 2>/dev/null | head -1) || true
          if [ -z "$setup" ]; then
            echo "::error::the bundler produced no installer"
            exit 1
          fi

          script=$(ls target/release/nsis/*/installer.nsi 2>/dev/null | head -1) || true
          if [ -z "$script" ]; then
            echo "::error::makensis ran but left no script behind to read"
            exit 1
          fi

          status=0
          want() {
            if ! grep -q "$1" "$script"; then
              echo "::error::the generated installer does not $2"
              status=1
            fi
          }
          want 'oname=cp-panel.exe' \
            "lay down the panel; the sidecar was not bundled"
          want 'StrCpy .INSTDIR ".LOCALAPPDATA.Programs' \
            "keep the binaries out of the data folder"
          want '_is1" "UninstallString"' \
            "look for CopyPaste 2 before copying anything"
          want 'RmDir /r ".LOCALAPPDATA.${PRODUCTNAME}"' \
            "point its delete-my-data box at the folder the data is actually in"
          exit $status

      - name: How big it came out
        shell: bash
        run: ls -lh target/release/bundle/nsis/*-setup.exe
