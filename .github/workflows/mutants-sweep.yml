name: Mutants sweep

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants-sweep
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: the crates macOS can build / shard ${{ matrix.shard }} of 2
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust, from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: mutants
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-mutants
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest

      - name: Half of every mutant the pure crates carry
        id: run
        run: |
          set +e
          cargo mutants -p cp-core -p cp-store -p cp-config -p cp-mac --shard $(( ${{ matrix.shard }} - 1 ))/2 --no-times -j 2
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: What survived
        if: always()
        env:
          CODE: ${{ steps.run.outputs.code }}
          TITLE: the crates macOS can build, shard ${{ matrix.shard }} of 2
        run: bash scripts/mutants-report.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-core-${{ matrix.shard }}
          path: mutants.out/
          retention-days: 14

  windows:
    name: the crates Windows can build / shard ${{ matrix.shard }} of 2
    runs-on: windows-2025
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust, from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: mutants
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-mutants
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest

      - name: Half of every mutant the Windows crate carries
        id: run
        shell: bash
        run: |
          set +e
          cargo mutants -p cp-win -p cp-panel --shard $(( ${{ matrix.shard }} - 1 ))/2 --no-times -j 2
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: What survived
        if: always()
        shell: bash
        env:
          CODE: ${{ steps.run.outputs.code }}
          TITLE: the crates Windows can build, shard ${{ matrix.shard }} of 2
        run: bash scripts/mutants-report.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-windows-${{ matrix.shard }}
          path: mutants.out/
          retention-days: 14

  front:
    name: the window / shard ${{ matrix.shard }} of 2
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Half of the window, dealt out so the shards weigh the same
        run: |
          list=$(git ls-files src \
            | grep -E '\.tsx?$' \
            | grep -vE '\.test\.tsx?$|^src/tests/|^src/locales\.ts$|^src/main\.tsx$|\.d\.ts$' \
            | xargs wc -l \
            | grep -v ' total$' \
            | sort -rn \
            | awk -v shard=${{ matrix.shard }} -v many=2 '
                { name[NR] = $2; wide[NR] = $1; count = NR }
                END {
                  for (i = 1; i <= count; i++) {
                    least = 1
                    for (s = 2; s <= many; s++) if (load[s] < load[least]) least = s
                    load[least] += wide[i]
                    if (least == shard) print name[i]
                  }
                }' \
            | paste -sd, -)
          echo "$list"
          npx stryker run --mutate "$list" --concurrency 4 \
            --reporters progress-append-only,clear-text,json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-window-${{ matrix.shard }}
          path: app/reports/stryker.json
          if-no-files-found: error
          retention-days: 14

  score:
    name: what the whole sweep came to
    if: always() && !cancelled()
    needs: [core, windows, front]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked] the credential is what writes the score branch below

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-*
          path: outcomes

      - name: Every shard told as one number
        env:
          WANT: 4
          WANT_WINDOW: 2
        run: python3 scripts/mutants_score.py

      # a dispatch runs from any branch, and the badge must only ever say what main measures
      - name: The number, on the branch that holds nothing else
        if: github.ref == 'refs/heads/main'
        run: |
          mv mutants.json "$RUNNER_TEMP/mutants.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch origin score --depth 1 2>/dev/null; then
            git switch -C score FETCH_HEAD
          else
            git switch --orphan score
          fi
          git rm -rq --cached . 2>/dev/null || true

          cp "$RUNNER_TEMP/mutants.json" mutants.json
          git add -- mutants.json
          if git diff --cached --quiet; then
            echo "the score has not moved"
            exit 0
          fi
          git commit -m "chore: what the sweep of $(date -u +%Y-%m-%d) came to"
          for attempt in 1 2 3; do
            if git push origin score; then
              exit 0
            fi
            echo "the score would not push (${attempt}/3)"
            git fetch origin score --depth 1 || true
            git rebase FETCH_HEAD || git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "::error::the score would not push"
          exit 1
