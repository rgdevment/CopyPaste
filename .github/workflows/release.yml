name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            version:
                description: "Version to use (e.g. 2.1.0). Defaults to 2.0.0-dev"
                required: false
                default: "2.0.0-dev"

permissions:
    contents: write

# Releases publish to repositories shared with other projects; never run two at once.
concurrency:
    group: release
    cancel-in-progress: false

jobs:
    extract-version:
        runs-on: ubuntu-latest
        name: Extract Version
        timeout-minutes: 5
        outputs:
            version: ${{ steps.get_version.outputs.VERSION }}
            is_prerelease: ${{ steps.get_version.outputs.IS_PRERELEASE }}
            is_tag: ${{ steps.get_version.outputs.IS_TAG }}
        steps:
            - name: Resolve version
              id: get_version
              env:
                  DISPATCH_VERSION: ${{ github.event.inputs.version }}
              run: |
                  set -euo pipefail
                  IS_TAG="false"
                  if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
                    VERSION="$DISPATCH_VERSION"
                  elif [[ "$GITHUB_REF" =~ refs/tags/v(.+) ]]; then
                    VERSION="${BASH_REMATCH[1]}"
                    IS_TAG="true"
                  else
                    VERSION="2.0.0"
                  fi

                  if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                    echo "::error::'$VERSION' is not a valid version (expected MAJOR.MINOR.PATCH[-prerelease])"
                    exit 1
                  fi

                  IS_PRERELEASE="false"
                  if [[ "$VERSION" == *-* ]]; then
                    IS_PRERELEASE="true"
                  fi

                  echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
                  echo "IS_TAG=$IS_TAG" >> "$GITHUB_OUTPUT"
                  echo "Resolved version: $VERSION (prerelease=$IS_PRERELEASE, tag=$IS_TAG)"

            # Fails now instead of after 45 minutes of builds, or worse, silently unsigned.
            - name: Check publishing credentials
              if: steps.get_version.outputs.IS_TAG == 'true'
              env:
                  RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
                  GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
                  STORE_APP_ID: ${{ vars.STORE_APP_ID }}
                  PFX_BASE64: ${{ secrets.PFX_BASE64 }}
                  PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
                  MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
                  MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  IS_PRERELEASE: ${{ steps.get_version.outputs.IS_PRERELEASE }}
              run: |
                  set -uo pipefail
                  status=0

                  require() {
                    if [[ -z "${!1:-}" ]]; then
                      echo "::error::$1 is not set; $2"
                      status=1
                    else
                      echo "ok      $1"
                    fi
                  }
                  prefer() {
                    if [[ -z "${!1:-}" ]]; then
                      echo "::warning::$1 is not set; $2"
                    else
                      echo "ok      $1"
                    fi
                  }

                  require RELEASE_PRIVATE_KEY "release-manifest.json cannot be signed"
                  require GIST_TOKEN "the Homebrew tap and Scoop bucket cannot be updated"
                  if [[ "$IS_PRERELEASE" != "true" ]]; then
                    require STORE_APP_ID "the Microsoft Store submission has no product id"
                  fi

                  prefer PFX_BASE64 "the Windows installer will ship unsigned"
                  prefer PFX_PASSWORD "the Windows installer will ship unsigned"
                  prefer MACOS_CERTIFICATE_P12 "the macOS build will be ad-hoc signed and not notarized"
                  prefer MACOS_CERTIFICATE_PASSWORD "the macOS certificate cannot be imported"
                  prefer APPLE_ID "the DMG will not be notarized"
                  prefer APPLE_APP_PASSWORD "the DMG will not be notarized"
                  prefer APPLE_TEAM_ID "the DMG will not be notarized"

                  exit $status

    build-windows:
        needs: extract-version
        uses: ./.github/workflows/release-win.yml
        with:
            version: ${{ needs.extract-version.outputs.version }}
        secrets: inherit

    build-macos:
        needs: extract-version
        uses: ./.github/workflows/release-mac.yml
        with:
            version: ${{ needs.extract-version.outputs.version }}
        secrets: inherit

    github-release:
        runs-on: ubuntu-latest
        needs: [extract-version, build-windows, build-macos]
        if: needs.extract-version.outputs.is_tag == 'true'
        timeout-minutes: 10
        name: Create GitHub Release

        permissions:
            contents: write
            id-token: write
            attestations: write

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.ref_name }}
                  fetch-depth: 0

            - name: Extract tag message
              id: tag_message
              run: |
                  MSG=$(git tag -l --format='%(contents:body)' "${{ github.ref_name }}" | sed '/-----BEGIN SSH SIGNATURE-----/,$d' | sed -e :a -e '/^\n*$/{$d;N;ba}')
                  echo "TAG_BODY<<EOF" >> $GITHUB_OUTPUT
                  echo "$MSG" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Download all artifacts
              uses: actions/download-artifact@v7
              with:
                  path: artifacts

            # attest-build-provenance only fails when *every* pattern comes up
            # empty, so a single missing artifact would be signed away in silence.
            - name: Verify every release artifact is present
              env:
                  IS_PRERELEASE: ${{ needs.extract-version.outputs.is_prerelease }}
              run: |
                  set -euo pipefail
                  shopt -s globstar nullglob
                  patterns=(
                    'artifacts/release-windows/**/*_Setup.exe'
                    'artifacts/release-macos/*.dmg'
                  )
                  if [[ "$IS_PRERELEASE" != "true" ]]; then
                    patterns+=( 'artifacts/release-windows/**/*_store.msix*' )
                  fi
                  status=0
                  for pattern in "${patterns[@]}"; do
                    matches=( $pattern )
                    if (( ${#matches[@]} == 0 )); then
                      echo "::error::No artifact matched '${pattern}'"
                      status=1
                    else
                      printf '%s -> %s\n' "$pattern" "${matches[*]}"
                    fi
                  done
                  exit $status

            - uses: actions/attest-build-provenance@v4
              with:
                  subject-path: |
                      artifacts/release-windows/**/*_Setup.exe
                      artifacts/release-windows/**/*_store.msix*
                      artifacts/release-macos/*.dmg

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  body: ${{ steps.tag_message.outputs.TAG_BODY }}
                  generate_release_notes: true
                  prerelease: ${{ needs.extract-version.outputs.is_prerelease == 'true' }}
                  make_latest: ${{ needs.extract-version.outputs.is_prerelease != 'true' }}
                  files: |
                      artifacts/release-windows/**/*_Setup.exe
                      artifacts/release-windows/**/*_store.msix*
                      artifacts/release-macos/*.dmg
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    publish-release-manifest:
        runs-on: ubuntu-latest
        needs: [extract-version, github-release]
        if: needs.extract-version.outputs.is_tag == 'true'
        timeout-minutes: 5
        name: Sign and publish release-manifest.json

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.ref_name }}
                  fetch-depth: 0

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true

            - name: Resolve dependencies
              working-directory: app
              run: flutter pub get

            - name: Inject Microsoft Store productId
              env:
                  STORE_APP_ID: ${{ vars.STORE_APP_ID }}
              run: |
                  if [ -z "$STORE_APP_ID" ]; then
                    echo "vars.STORE_APP_ID is not set" >&2
                    exit 1
                  fi
                  sed -i "s|ms-windows-store://pdp/?productid=PLACEHOLDER|ms-windows-store://pdp/?productid=${STORE_APP_ID}|" release-manifest.json
                  grep -q "productid=${STORE_APP_ID}" release-manifest.json

            - name: Override latest, URLs and standard release notes
              run: |
                  TAG="${GITHUB_REF_NAME}"
                  VERSION="${TAG#v}"
                  REPO="${{ github.repository }}"
                  RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"

                  TAG_BODY=$(git tag -l --format='%(contents)' "$TAG" | sed '/-----BEGIN SSH SIGNATURE-----/,$d')
                  read_trailer() {
                    printf '%s\n' "$TAG_BODY" \
                      | grep -iE "^$1:" \
                      | head -n 1 \
                      | sed -E "s/^[^:]+:[[:space:]]*//" \
                      | tr -d '\r'
                  }

                  SEVERITY_OVERRIDE=$(read_trailer 'Severity')
                  MIN_SUPPORTED_OVERRIDE=$(read_trailer 'Min-Supported')
                  BLOCKED_OVERRIDE=$(read_trailer 'Blocked')

                  SEVERITY_CURRENT=$(jq -r '.severity // "recommended"' release-manifest.json)
                  SEVERITY="${SEVERITY_OVERRIDE:-recommended}"
                  case "$SEVERITY" in
                    critical|recommended|patch) ;;
                    *)
                      echo "::error::Invalid Severity trailer '$SEVERITY' (expected: critical|recommended|patch)"
                      exit 1
                      ;;
                  esac
                  echo "Severity: $SEVERITY (override=${SEVERITY_OVERRIDE:-<none>}, previous=${SEVERITY_CURRENT})"

                  if [[ "$SEVERITY" == "critical" && -z "$MIN_SUPPORTED_OVERRIDE" ]]; then
                    echo "::error::A critical release must carry an explicit Min-Supported trailer; the default ($VERSION) locks out every Linux install (<= 2.11.0)."
                    exit 1
                  fi

                  MIN_SUPPORTED="${MIN_SUPPORTED_OVERRIDE:-$VERSION}"
                  echo "minimumSupported: $MIN_SUPPORTED (override=${MIN_SUPPORTED_OVERRIDE:-<none>})"

                  if [[ -n "$BLOCKED_OVERRIDE" ]]; then
                    BLOCKED_JSON=$(printf '%s' "$BLOCKED_OVERRIDE" \
                      | tr ',' '\n' \
                      | sed -E 's/^[[:space:]]+|[[:space:]]+$//g' \
                      | grep -v '^$' \
                      | jq -R . | jq -s .)
                  else
                    BLOCKED_JSON='[]'
                  fi
                  echo "blockedVersions: $BLOCKED_JSON (override=${BLOCKED_OVERRIDE:-<none>})"

                  SUMMARY_EN="CopyPaste ${TAG} (${SEVERITY} update). See release notes for details."
                  SUMMARY_ES="CopyPaste ${TAG} (actualización ${SEVERITY}). Consulta las notas de la versión."

                  jq \
                    --arg version "$VERSION" \
                    --arg url "$RELEASE_URL" \
                    --arg severity "$SEVERITY" \
                    --arg min_supported "$MIN_SUPPORTED" \
                    --argjson blocked "$BLOCKED_JSON" \
                    --arg sum_en "$SUMMARY_EN" \
                    --arg sum_es "$SUMMARY_ES" \
                    '.latest = $version
                     | .severity = $severity
                     | .minimumSupported = $min_supported
                     | .blockedVersions = $blocked
                     | .releaseNotes.en.summary = $sum_en
                     | .releaseNotes.en.url = $url
                     | .releaseNotes.es.summary = $sum_es
                     | .releaseNotes.es.url = $url' \
                    release-manifest.json > release-manifest.tmp.json
                  mv release-manifest.tmp.json release-manifest.json

                  echo "--- Final manifest to publish ---"
                  cat release-manifest.json

            - name: Sign manifest
              working-directory: app
              env:
                  RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
              run: |
                  if [ -z "$RELEASE_PRIVATE_KEY" ]; then
                    echo "RELEASE_PRIVATE_KEY secret is not set" >&2
                    exit 1
                  fi
                  printf '%s' "$RELEASE_PRIVATE_KEY" | dart run tools/sign_manifest.dart \
                    ../release-manifest.json \
                    ../release-manifest.json.sig

            - name: Upload manifest assets to release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release upload "${{ github.ref_name }}" \
                    release-manifest.json \
                    release-manifest.json.sig \
                    --clobber

    publish-to-store:
        runs-on: windows-latest
        needs: [extract-version, github-release]
        if: needs.extract-version.outputs.is_tag == 'true' && needs.extract-version.outputs.is_prerelease != 'true'
        timeout-minutes: 15
        name: Publish to Microsoft Store

        steps:
            - name: Install Microsoft Store Developer CLI
              uses: microsoft/microsoft-store-apppublisher@v1.3
              with:
                  version: v0.3.9

            - name: Download Windows artifacts
              uses: actions/download-artifact@v7
              with:
                  name: release-windows
                  path: artifacts/windows

            - name: Find MSIX package
              id: find_msix
              shell: bash
              run: |
                  MSIX=$(find artifacts/windows -name "*.msixupload" | head -1)
                  [ -z "$MSIX" ] && MSIX=$(find artifacts/windows -name "*.msixbundle" | head -1)
                  [ -z "$MSIX" ] && MSIX=$(find artifacts/windows -name "*.msix" | head -1)
                  if [ -z "$MSIX" ]; then
                    echo "Error: No MSIX package found in release-windows artifact"
                    find artifacts/windows -type f
                    exit 1
                  fi
                  echo "MSIX_PATH=$MSIX" >> $GITHUB_OUTPUT
                  echo "Found: $MSIX"

            - name: Configure Microsoft Store CLI
              shell: bash
              run: |
                  msstore reconfigure \
                    --tenantId "${{ secrets.STORE_TENANT_ID }}" \
                    --sellerId "${{ secrets.STORE_SELLER_ID }}" \
                    --clientId "${{ secrets.STORE_CLIENT_ID }}" \
                    --clientSecret "${{ secrets.STORE_CLIENT_SECRET }}"

            - name: Publish to Microsoft Store
              shell: bash
              run: |
                  msstore publish "${{ steps.find_msix.outputs.MSIX_PATH }}" \
                    --appId "${{ vars.STORE_APP_ID }}"

    update-homebrew-cask:
        runs-on: ubuntu-latest
        needs: [extract-version, github-release]
        if: needs.extract-version.outputs.is_tag == 'true'
        timeout-minutes: 5
        name: Update Homebrew Tap

        steps:
            - name: Update Homebrew Tap
              env:
                  GH_TOKEN: ${{ secrets.GIST_TOKEN }}
              run: |
                  set -euo pipefail

                  TAG="${GITHUB_REF_NAME}"
                  VERSION="${TAG#v}"

                  DMG_NAME="CopyPaste_${VERSION}_universal.dmg"
                  DMG_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${DMG_NAME}"

                  echo "Downloading DMG to compute SHA256..."
                  curl -fSL --retry 5 --retry-delay 10 --retry-all-errors \
                    -o "/tmp/${DMG_NAME}" "${DMG_URL}"
                  DMG_SHA256=$(sha256sum "/tmp/${DMG_NAME}" | awk '{print $1}')
                  rm -f "/tmp/${DMG_NAME}"

                  echo "Version: ${VERSION}"
                  echo "DMG SHA256: ${DMG_SHA256}"

                  if [[ "$VERSION" == *-* ]]; then
                    CASK_FILE="Casks/copypaste-beta.rb"
                    CASK_NAME="copypaste-beta"
                    CASK_DESC="Clipboard history manager for macOS (beta)"
                  else
                    CASK_FILE="Casks/copypaste.rb"
                    CASK_NAME="copypaste"
                    CASK_DESC="Clipboard history manager for macOS"
                  fi

                  git clone "https://x-access-token:${GH_TOKEN}@github.com/rgdevment/homebrew-tap.git" /tmp/homebrew-tap
                  cd /tmp/homebrew-tap

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  mkdir -p Casks

                  cat > "${CASK_FILE}" <<- CASK_EOF
                  	cask "${CASK_NAME}" do
                  	  version "${VERSION}"
                  	  sha256 "${DMG_SHA256}"

                  	  url "${DMG_URL}"
                  	  name "CopyPaste"
                  	  desc "${CASK_DESC}"
                  	  homepage "https://github.com/${{ github.repository }}"

                  	  depends_on macos: :ventura

                  	  app "CopyPaste.app"

                  	  zap trash: [
                  	    "~/Library/Application Support/com.rgdevment.copypaste",
                  	  ]
                  	end
                  CASK_EOF

                  git add "${CASK_FILE}"
                  if git diff --cached --quiet; then
                    echo "Homebrew Tap already at ${VERSION}, nothing to push"
                    exit 0
                  fi
                  git commit -m "Update ${CASK_NAME} to ${VERSION}"

                  # Shared tap: a concurrent release can land between fetch and push.
                  for attempt in 1 2 3 4 5; do
                    if (( attempt > 1 )); then
                      sleep $(( (attempt - 1) * 5 ))
                      git fetch origin main
                      git rebase origin/main
                    fi
                    if git push origin HEAD:main; then
                      echo "Homebrew Tap updated: cask ${CASK_NAME} → ${VERSION}"
                      exit 0
                    fi
                    echo "Push rejected (attempt ${attempt})"
                  done
                  echo "::error::Could not push ${VERSION} to the Homebrew Tap"
                  exit 1

    update-scoop-bucket:
        runs-on: ubuntu-latest
        needs: [extract-version, github-release]
        if: needs.extract-version.outputs.is_tag == 'true'
        timeout-minutes: 5
        name: Update Scoop Bucket

        steps:
            - name: Update Scoop Bucket
              env:
                  GH_TOKEN: ${{ secrets.GIST_TOKEN }}
              run: |
                  set -euo pipefail

                  TAG="${GITHUB_REF_NAME}"
                  VERSION="${TAG#v}"
                  BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
                  SETUP="CopyPaste_${VERSION}_x64_Setup.exe"

                  if [[ "$VERSION" == *-* ]]; then
                    NAME="copypaste-beta"; SUFFIX=" (beta)"
                  else
                    NAME="copypaste"; SUFFIX=""
                  fi

                  curl -fSL --retry 5 --retry-delay 10 --retry-all-errors \
                    -o "/tmp/${SETUP}" "${BASE}/${SETUP}"
                  SHA=$(sha256sum "/tmp/${SETUP}" | awk '{print $1}')

                  # Scoop unpacks the installer without ever running its
                  # uninstaller, so the Run value the app writes would outlive it.
                  RUN_KEY='HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
                  UNINSTALL="Remove-ItemProperty -Path '${RUN_KEY}' -Name 'CopyPaste' -ErrorAction SilentlyContinue"

                  git clone "https://x-access-token:${GH_TOKEN}@github.com/rgdevment/scoop-bucket.git" /tmp/bucket
                  cd /tmp/bucket
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  mkdir -p bucket

                  jq -n \
                    --arg version "$VERSION" \
                    --arg desc "Clipboard history manager${SUFFIX}" \
                    --arg home "https://github.com/${{ github.repository }}" \
                    --arg url "${BASE}/${SETUP}" \
                    --arg hash "$SHA" \
                    --arg shortcut "CopyPaste${SUFFIX}" \
                    --arg uninstall "$UNINSTALL" \
                    '{
                      version: $version,
                      description: $desc,
                      homepage: $home,
                      license: "GPL-3.0-only",
                      architecture: {"64bit": {url: $url, hash: $hash}},
                      innosetup: true,
                      shortcuts: [["CopyPaste.exe", $shortcut]],
                      pre_uninstall: [$uninstall]
                    }' > "bucket/${NAME}.json"

                  git add "bucket/${NAME}.json"
                  if git diff --cached --quiet; then
                    echo "Scoop bucket already at ${VERSION}, nothing to push"
                    exit 0
                  fi
                  git commit -m "${NAME} ${VERSION}"

                  # Three repos share this bucket: a concurrent release can land
                  # between fetch and push.
                  for attempt in 1 2 3 4 5; do
                    if (( attempt > 1 )); then
                      sleep $(( (attempt - 1) * 5 ))
                      git fetch origin main
                      git rebase origin/main
                    fi
                    if git push origin HEAD:main; then
                      echo "Scoop bucket updated: ${NAME} → ${VERSION}"
                      exit 0
                    fi
                    echo "Push rejected (attempt ${attempt})"
                  done
                  echo "::error::Could not push ${NAME} ${VERSION} to the Scoop bucket"
                  exit 1
